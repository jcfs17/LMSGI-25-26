<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla y Formulario</title>
    <style>
        table { border-collapse: collapse; width: 60%; margin: 20px auto; }
        td, th { border: 1px solid #333; padding: 10px; text-align: center; }
        form { width: 300px; margin: auto; display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>
    <h1 style="text-align:center;">Tabla y Formulario</h1>

    <table>
        <tr><th>Nombre</th><th>Edad</th></tr>
        <tr><td>Ana</td><td>20</td></tr>
        <tr><td>Pedro</td><td>22</td></tr>
    </table>

    <form>
        <input type="text" placeholder="Nombre">
        <input type="number" placeholder="Edad">
        <button>Enviar</button>
    </form>
</body>
</html>
